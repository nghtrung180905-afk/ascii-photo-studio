<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCII Photo & Video Studio — @nghtrung</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0e121b;
      --panel-2: #151b28;
      --border: #252e42;
      --text: #dce3f0;
      --dim: #7d89a3;
      --accent: #ffc45a;
      --accent-2: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030407;
      color: var(--text);
      font-family: Consolas, Menlo, "DejaVu Sans Mono", "Segoe UI", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 28px;
    }
    header {
      width: min(1180px, 98vw);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .brand span.tag {
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      padding: 2px 8px;
      border: 1px solid rgba(255, 196, 90, 0.35);
      border-radius: 999px;
      background: rgba(255, 196, 90, 0.08);
    }

    .layout {
      width: min(1180px, 98vw);
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 880px) {
      .layout { grid-template-columns: 1fr; }
    }

    .sidebar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .dropzone {
      border: 1.5px dashed #3b4866;
      border-radius: 8px;
      padding: 15px 12px;
      text-align: center;
      cursor: pointer;
      background: #090c12;
      transition: border-color 0.2s, background 0.2s;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(255, 196, 90, 0.06);
    }
    .dropzone .title { font-size: 13px; color: #eef2fa; margin-bottom: 4px; font-weight: 600; }
    .dropzone .sub { font-size: 11px; color: var(--dim); }
    input[type="file"] { display: none; }

    .group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid #1b2232;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .row label { color: #b9c4da; }
    .row .val { color: var(--accent); font-size: 11.5px; }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
    select, input[type="text"] {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 9px;
      font-family: inherit;
      font-size: 12px;
    }
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid #1b2232;
    }
    button {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid #2e3952;
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: #0b0e14;
      border: none;
      font-weight: 700;
      padding: 9px 12px;
    }
    button.primary:hover { filter: brightness(1.08); color: #05070b; }
    button.video-btn {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #041019;
      border: none;
      font-weight: 700;
      padding: 9px 12px;
      display: none;
    }
    button.video-btn.visible { display: block; }
    button.video-btn.recording {
      background: linear-gradient(135deg, #dc2626, #f87171);
      color: #ffffff;
    }

    .stage-wrap {
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 540px;
      padding: 10px;
      position: relative;
    }
    canvas#asciiCanvas {
      max-width: 100%;
      max-height: 78vh;
      width: auto;
      height: auto;
      display: block;
      border-radius: 4px;
      background: #000000;
    }

    .video-bar {
      width: 100%;
      margin-top: 8px;
      padding: 7px 10px;
      background: #0c1018;
      border: 1px solid #1d2536;
      border-radius: 6px;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }
    .video-bar.visible { display: flex; }
    .video-bar button {
      padding: 4px 10px;
      font-size: 11.5px;
      flex-shrink: 0;
    }
    .video-bar input[type="range"] { flex: 1; }
    .video-time {
      color: var(--accent);
      font-size: 11.5px;
      min-width: 82px;
      text-align: right;
      flex-shrink: 0;
    }

    .meta-bar {
      width: 100%;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #141a26;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--dim);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>ASCII Photo &amp; Video Studio</span>
      <span class="tag">@nghtrung</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="dropzone" id="dropzone">
        <div class="title">📷🎬 Chọn Ảnh hoặc Video</div>
        <div class="sub">Hỗ trợ JPG, PNG, WEBP, MP4, MOV, WEBM</div>
        <input type="file" id="fileInput" accept="image/*,video/*" />
      </div>

      <div class="group">
        <div class="row"><label>Độ chi tiết (Số cột)</label><span class="val" id="valCols">116</span></div>
        <input type="range" id="slCols" min="50" max="180" step="2" value="116" />

        <div class="row"><label>Cắt nền đen (Black Cut)</label><span class="val" id="valBlack">6%</span></div>
        <input type="range" id="slBlack" min="0" max="50" step="1" value="6" />

        <div class="row"><label>Độ sáng (Brightness)</label><span class="val" id="valBright">1.10</span></div>
        <input type="range" id="slBright" min="0.5" max="2.2" step="0.05" value="1.10" />

        <div class="row"><label>Tương phản (Contrast)</label><span class="val" id="valContrast">1.20</span></div>
        <input type="range" id="slContrast" min="0.6" max="2.5" step="0.05" value="1.20" />

        <div class="row"><label>Phát sáng điểm nổi (Bloom)</label><span class="val" id="valGlow">55%</span></div>
        <input type="range" id="slGlow" min="0" max="100" step="2" value="55" />
      </div>

      <div class="group">
        <div class="row"><label>Chế độ màu</label></div>
        <select id="selColor">
          <option value="truecolor">Màu gốc phát sáng (Truecolor)</option>
          <option value="vivid">Màu rực rỡ (Vivid Neon)</option>
          <option value="gold">Vàng ấm (Warm Gold)</option>
          <option value="matrix">Xanh Matrix (Cyber Green)</option>
          <option value="cyber">Tím / Hồng Cyberpunk</option>
          <option value="mono">Trắng bạc (Monochrome)</option>
        </select>

        <div class="row" style="margin-top:4px;"><label>Bộ ký tự ASCII</label></div>
        <select id="selRamp">
          <option value=" .:-~=+*xv%&#W@">Chi tiết (Standard)</option>
          <option value=" .:-=+*#%@">Cổ điển sắc nét (Classic)</option>
          <option value=" .'`^&quot;,:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$">Siêu mịn (70 ký tự)</option>
          <option value=" ░▒▓█">Khối Pixel (Blocks)</option>
          <option value=" .·°oO0@●">Chấm tròn (Dots &amp; Circles)</option>
          <option value=" .01">Nhị phân (Binary 0/1)</option>
          <option value=" .1234567890#">Ma trận số (Numbers)</option>
          <option value=" ·-+×÷=≡◈◆■">Hình học (Geometric)</option>
          <option value=" .:;+=xX$&amp;WM">Chữ cái đậm (Bold Letters)</option>
          <option value=" .,-~;/|\=+*#">Nét vẽ tay (Sketch Lines)</option>
          <option value=" ⠁⠃⠇⠏⠟⠿⡿⣿">Chấm Braille (Braille)</option>
          <option value=" .·+*✦✧♥❤">Sao &amp; Trái tim (Stars &amp; Hearts)</option>
          <option value=" .:+@">Tối giản (Minimal)</option>
        </select>
      </div>

      <div class="group">
        <div class="row"><label>Ghép bằng chữ tùy chọn (Word Art)</label></div>
        <input type="text" id="inpWordArt" value="" maxlength="40" placeholder="VD: become  hoặc  EM YÊU (bỏ trống = dùng bộ ký tự)" />
        <div class="row" style="margin-top:4px;"><label>Lời chúc bên dưới</label></div>
        <input type="text" id="inpCaption" value="" maxlength="48" placeholder="Nhập lời chúc nếu muốn..." />
        <div class="row" style="margin-top:4px;"><label>Chữ ký góc trái</label></div>
        <input type="text" id="inpSign" value="" maxlength="24" placeholder="Nhập chữ ký nếu muốn..." />
      </div>

      <div class="actions">
        <button class="video-btn" id="btnExportVideo">🎬 Xuất Video ASCII (kèm âm thanh)</button>
        <button class="primary" id="btnDownload">⬇ Tải Ảnh PNG Nét Cao</button>
        <button id="btnReplay">▶ Quét lại hiệu ứng</button>
        <button id="btnCopyTxt">📋 Copy Text ASCII</button>
      </div>
    </aside>

    <main class="stage-wrap">
      <canvas id="asciiCanvas"></canvas>

      <div class="video-bar" id="videoBar">
        <button id="btnPlayPause">⏸ Dừng</button>
        <input type="range" id="vidSeek" min="0" max="100" step="0.05" value="0" />
        <span class="video-time" id="vidTime">0:00 / 0:00</span>
        <button id="btnMute">🔊 Tiếng</button>
      </div>

      <div class="meta-bar">
        <span id="metaGrid">Grid: 116 × 72</span>
        <span id="metaHint">Kéo thả ảnh hoặc video bất kỳ từ máy / điện thoại</span>
      </div>
    </main>
  </div>

  <video id="srcVideo" playsinline loop crossorigin="anonymous" style="display:none;"></video>

  <script>
    const CW = 9, CH = 14;
    const canvas = document.getElementById("asciiCanvas");
    const ctx = canvas.getContext("2d");

    const sampleCanvas = document.createElement("canvas");
    const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

    const crispCanvas = document.createElement("canvas");
    const crispCtx = crispCanvas.getContext("2d");

    // Separate selective highlight buffer so only bright highlights bloom while text stays razor sharp
    const bloomSrcCanvas = document.createElement("canvas");
    const bloomSrcCtx = bloomSrcCanvas.getContext("2d");

    const glowCanvas = document.createElement("canvas");
    const glowCtx = glowCanvas.getContext("2d");

    const glyphCache = new Map();
    const glyphHelper = document.createElement("canvas");
    glyphHelper.width = CW;
    glyphHelper.height = CH;
    const gCtx = glyphHelper.getContext("2d", { willReadFrequently: true });

    function getGlyphAlpha(ch) {
      let mask = glyphCache.get(ch);
      if (mask) return mask;
      gCtx.clearRect(0, 0, CW, CH);
      gCtx.font = "bold 14px Consolas, Menlo, 'DejaVu Sans Mono', monospace";
      gCtx.textAlign = "center";
      gCtx.textBaseline = "middle";
      gCtx.fillStyle = "#ffffff";
      gCtx.fillText(ch, CW * 0.5, CH * 0.53);
      const data = gCtx.getImageData(0, 0, CW, CH).data;
      mask = new Uint8Array(CW * CH);
      for (let i = 0; i < CW * CH; i++) mask[i] = data[i * 4 + 3];
      glyphCache.set(ch, mask);
      return mask;
    }

    // State
    let mediaType = "image"; // "image" | "video"
    let sourceImage = null;
    const srcVideo = document.getElementById("srcVideo");
    let currentVideoUrl = null;
    let gridCols = 116, gridRows = 72, artRows = 72;
    let imgPixels = null;
    let frameImg = null, frameU32 = null;
    let bloomImg = null, bloomU32 = null;
    let revealProgress = 0;
    let lastTs = performance.now();
    let elapsed = 0;

    // Video export state
    let isExporting = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let audioCtx = null;
    let audioSrcNode = null;
    let audioDestNode = null;

    // UI elements
    const slCols = document.getElementById("slCols");
    const slBlack = document.getElementById("slBlack");
    const slBright = document.getElementById("slBright");
    const slContrast = document.getElementById("slContrast");
    const slGlow = document.getElementById("slGlow");
    const selColor = document.getElementById("selColor");
    const selRamp = document.getElementById("selRamp");
    const inpWordArt = document.getElementById("inpWordArt");
    const inpCaption = document.getElementById("inpCaption");
    const inpSign = document.getElementById("inpSign");
    const metaGrid = document.getElementById("metaGrid");
    const metaHint = document.getElementById("metaHint");
    const videoBar = document.getElementById("videoBar");
    const btnPlayPause = document.getElementById("btnPlayPause");
    const vidSeek = document.getElementById("vidSeek");
    const vidTime = document.getElementById("vidTime");
    const btnMute = document.getElementById("btnMute");
    const btnExportVideo = document.getElementById("btnExportVideo");

    function createDemoImage() {
      const c = document.createElement("canvas");
      c.width = 640; c.height = 480;
      const d = c.getContext("2d");
      d.fillStyle = "#000000";
      d.fillRect(0, 0, 640, 480);

      const moon = d.createRadialGradient(485, 115, 8, 485, 115, 115);
      moon.addColorStop(0, "#fffbe6");
      moon.addColorStop(0.28, "#ffd266");
      moon.addColorStop(0.6, "rgba(255,180,70,0.18)");
      moon.addColorStop(1, "rgba(0,0,0,0)");
      d.fillStyle = moon;
      d.beginPath(); d.arc(485, 115, 115, 0, Math.PI * 2); d.fill();

      d.save();
      d.translate(290, 240);
      const hg = d.createRadialGradient(-25, -35, 15, 0, 0, 155);
      hg.addColorStop(0, "#ffc2cc");
      hg.addColorStop(0.35, "#ff2a55");
      hg.addColorStop(0.85, "#9c0b2f");
      hg.addColorStop(1, "#000000");
      d.fillStyle = hg;
      d.beginPath();
      d.moveTo(0, 115);
      d.bezierCurveTo(-155, 25, -165, -105, -75, -115);
      d.bezierCurveTo(-25, -120, 0, -70, 0, -50);
      d.bezierCurveTo(0, -70, 25, -120, 75, -115);
      d.bezierCurveTo(165, -105, 155, 25, 0, 115);
      d.fill();
      d.restore();
      return c;
    }

    function allocateGridBuffers() {
      const srcW = mediaType === "video" ? (srcVideo.videoWidth || 640) : (sourceImage.naturalWidth || sourceImage.width);
      const srcH = mediaType === "video" ? (srcVideo.videoHeight || 360) : (sourceImage.naturalHeight || sourceImage.height);
      if (!srcW || !srcH) return;

      gridCols = parseInt(slCols.value, 10);
      const imgAspect = srcH / Math.max(1, srcW);
      artRows = Math.max(24, Math.min(130, Math.round(gridCols * imgAspect * (CW / CH))));
      const hasFooter = inpCaption.value.trim().length > 0 || inpSign.value.trim().length > 0;
      const extraBottom = hasFooter ? 5 : 0;
      gridRows = artRows + extraBottom;

      sampleCanvas.width = gridCols;
      sampleCanvas.height = artRows;

      const W = gridCols * CW;
      const H = gridRows * CH;
      canvas.width = W;
      canvas.height = H;
      crispCanvas.width = W;
      crispCanvas.height = H;
      bloomSrcCanvas.width = W;
      bloomSrcCanvas.height = H;
      glowCanvas.width = Math.max(1, Math.floor(W / 4));
      glowCanvas.height = Math.max(1, Math.floor(H / 4));

      frameImg = crispCtx.createImageData(W, H);
      frameU32 = new Uint32Array(frameImg.data.buffer);
      bloomImg = bloomSrcCtx.createImageData(W, H);
      bloomU32 = new Uint32Array(bloomImg.data.buffer);

      metaGrid.textContent = `Grid: ${gridCols} × ${artRows} · ${(gridCols * artRows).toLocaleString()} ô · ${W}×${H}px`;
    }

    function sampleCurrentFrame() {
      if (mediaType === "video") {
        if (srcVideo.readyState >= 2) {
          sampleCtx.drawImage(srcVideo, 0, 0, gridCols, artRows);
          imgPixels = sampleCtx.getImageData(0, 0, gridCols, artRows).data;
        }
      } else if (sourceImage) {
        sampleCtx.drawImage(sourceImage, 0, 0, gridCols, artRows);
        imgPixels = sampleCtx.getImageData(0, 0, gridCols, artRows).data;
      }
    }

    function applyColorMode(r, g, b, lum, mode) {
      if (mode === "truecolor") return [r, g, b];
      if (mode === "vivid") {
        const avg = (r + g + b) / 3;
        return [
          Math.min(255, Math.max(0, avg + (r - avg) * 1.52)),
          Math.min(255, Math.max(0, avg + (g - avg) * 1.52)),
          Math.min(255, Math.max(0, avg + (b - avg) * 1.52))
        ];
      }
      if (mode === "gold") {
        return [Math.min(255, lum * 285), Math.min(255, lum * 215), Math.min(255, lum * 95)];
      }
      if (mode === "matrix") {
        return [Math.min(255, lum * 70), Math.min(255, lum * 265), Math.min(255, lum * 125)];
      }
      if (mode === "cyber") {
        return [
          Math.min(255, 65 + lum * 210),
          Math.min(255, 30 + lum * 135),
          Math.min(255, 110 + lum * 170)
        ];
      }
      const v = Math.min(255, lum * 255);
      return [v * 0.92, v * 0.96, v];
    }

    function buildRawAsciiText() {
      sampleCurrentFrame();
      if (!imgPixels) return "";
      const ramp = Array.from(selRamp.value);
      const wordStr = inpWordArt.value;
      const wordChars = wordStr.length > 0 ? Array.from(wordStr + " ") : null;
      const blackCut = parseInt(slBlack.value, 10) / 100;
      const bright = parseFloat(slBright.value);
      const contrast = parseFloat(slContrast.value);
      let out = "";
      for (let y = 0; y < artRows; y++) {
        for (let x = 0; x < gridCols; x++) {
          const i = (y * gridCols + x) * 4;
          const r = imgPixels[i] / 255, g = imgPixels[i + 1] / 255, b = imgPixels[i + 2] / 255;
          let lum = 0.299 * r + 0.587 * g + 0.114 * b;
          lum = ((lum - 0.5) * contrast + 0.5) * bright;
          if (lum <= blackCut) { out += " "; continue; }
          lum = Math.max(0, Math.min(1, (lum - blackCut) / Math.max(0.05, 1 - blackCut)));
          if (wordChars) {
            out += wordChars[(y * gridCols + x) % wordChars.length];
          } else {
            const idx = Math.min(ramp.length - 1, Math.floor(lum * (ramp.length - 1)));
            out += ramp[idx];
          }
        }
        out += "\n";
      }
      return out;
    }

    function fmtTime(sec) {
      if (!isFinite(sec)) return "0:00";
      const s = Math.floor(sec % 60);
      const m = Math.floor(sec / 60);
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function render(now) {
      const dt = Math.min(0.05, (now - lastTs) / 1000);
      lastTs = now;
      elapsed += dt;

      if (mediaType === "video") {
        revealProgress = 1.0;
        sampleCurrentFrame();
        if (srcVideo.duration && !srcVideo.paused) {
          vidSeek.value = srcVideo.currentTime;
          vidTime.textContent = `${fmtTime(srcVideo.currentTime)} / ${fmtTime(srcVideo.duration)}`;
          if (isExporting) {
            const pct = Math.min(99, Math.round((srcVideo.currentTime / srcVideo.duration) * 100));
            btnExportVideo.textContent = `⏹ Đang xuất ${pct}% (Bấm để dừng)`;
          }
        }
      } else if (revealProgress < 1.0) {
        revealProgress = Math.min(1.0, revealProgress + dt * 0.58);
      }

      if (imgPixels && frameU32 && bloomU32) {
        const W = crispCanvas.width;
        const H = crispCanvas.height;
        const ramp = Array.from(selRamp.value);
        const rampLen = ramp.length;
        const wordRaw = inpWordArt.value;
        const wordChars = wordRaw.length > 0 ? Array.from(wordRaw + " ") : null;
        const blackCut = parseInt(slBlack.value, 10) / 100;
        const blackInvSpan = 1 / Math.max(0.05, 1 - blackCut);
        const bright = parseFloat(slBright.value);
        const contrast = parseFloat(slContrast.value);
        const glowAmt = parseInt(slGlow.value, 10) / 100;
        const mode = selColor.value;
        const scanRow = revealProgress * (artRows + 4);

        // Pure black #000000 -> 0xFF000000
        frameU32.fill(0xFF000000);
        bloomU32.fill(0xFF000000);

        for (let r = 0; r < artRows; r++) {
          if (r > scanRow) continue;
          const scanDist = scanRow - r;
          const scanFlash = (revealProgress < 0.999 && scanDist < 3.5) ? Math.pow(1 - scanDist / 3.5, 1.8) : 0;
          const yBase = r * CH;

          for (let c = 0; c < gridCols; c++) {
            const pIdx = (r * gridCols + c) * 4;
            let pr = ((imgPixels[pIdx] / 255 - 0.5) * contrast + 0.5) * bright;
            let pg = ((imgPixels[pIdx + 1] / 255 - 0.5) * contrast + 0.5) * bright;
            let pb = ((imgPixels[pIdx + 2] / 255 - 0.5) * contrast + 0.5) * bright;

            pr = pr < 0 ? 0 : pr > 1 ? 1 : pr;
            pg = pg < 0 ? 0 : pg > 1 ? 1 : pg;
            pb = pb < 0 ? 0 : pb > 1 ? 1 : pb;

            const rawLum = 0.299 * pr + 0.587 * pg + 0.114 * pb;
            if (rawLum <= blackCut && scanFlash < 0.1) continue;

            const lum = Math.min(1, Math.max(0, (rawLum - blackCut) * blackInvSpan));

            let ch;
            if (scanFlash > 0.45) {
              ch = "#";
            } else if (wordChars) {
              ch = wordChars[(r * gridCols + c) % wordChars.length];
            } else {
              const chIdx = Math.min(rampLen - 1, Math.max(0, Math.floor(lum * (rampLen - 1))));
              ch = ramp[chIdx];
            }
            if (ch === " ") continue;

            // Boost highlights slightly toward pure white for crisp 3D depth
            let [rr, gg, bb] = applyColorMode(pr * 255, pg * 255, pb * 255, lum, mode);
            if (wordChars) {
              const boost = 0.25 + 0.85 * lum;
              rr = Math.min(255, rr * boost);
              gg = Math.min(255, gg * boost);
              bb = Math.min(255, bb * boost);
            }
            if (scanFlash > 0) {
              rr = rr * (1 - scanFlash) + 255 * scanFlash;
              gg = gg * (1 - scanFlash) + 255 * scanFlash;
              bb = bb * (1 - scanFlash) + 255 * scanFlash;
            }

            const ri = rr | 0, gi = gg | 0, bi = bb | 0;
            const isHighlight = lum > 0.54 || scanFlash > 0.25;
            const mask = getGlyphAlpha(ch);
            const xBase = c * CW;

            for (let gy = 0; gy < CH; gy++) {
              const dstRow = (yBase + gy) * W + xBase;
              const srcRow = gy * CW;
              for (let gx = 0; gx < CW; gx++) {
                const a = mask[srcRow + gx];
                if (a > 12) {
                  const fr = (ri * a) >> 8;
                  const fg = (gi * a) >> 8;
                  const fb = (bi * a) >> 8;
                  const pxVal = (255 << 24) | (fb << 16) | (fg << 8) | fr;
                  frameU32[dstRow + gx] = pxVal;
                  if (isHighlight) {
                    bloomU32[dstRow + gx] = pxVal;
                  }
                }
              }
            }
          }
        }

        crispCtx.putImageData(frameImg, 0, 0);
        bloomSrcCtx.putImageData(bloomImg, 0, 0);

        const rawCap = inpCaption.value.trim().toUpperCase();
        if (rawCap && revealProgress > 0.35) {
          const spaced = Array.from(rawCap).join(" ");
          const chars = Array.from(spaced);
          const shown = Math.min(chars.length, Math.floor((revealProgress - 0.35) / 0.65 * chars.length * 1.4));
          const pal = [[250, 58, 64], [255, 206, 76], [46, 204, 102]];
          const yPx = (artRows + 2.2) * CH;
          const xStart = (W - chars.length * CW) * 0.5;
          crispCtx.font = "bold 14px Consolas, Menlo, 'Segoe UI', monospace";
          crispCtx.textAlign = "center";
          crispCtx.textBaseline = "middle";
          bloomSrcCtx.font = crispCtx.font;
          bloomSrcCtx.textAlign = "center";
          bloomSrcCtx.textBaseline = "middle";
          for (let i = 0; i < shown; i++) {
            const ch = chars[i];
            if (ch !== " ") {
              const col = pal[(Math.floor(i / 2) + Math.floor(elapsed * 1.5)) % 3];
              const pulse = 0.88 + 0.16 * Math.sin(elapsed * 5 + i);
              const style = `rgb(${Math.min(255, (col[0] * pulse) | 0)},${Math.min(255, (col[1] * pulse) | 0)},${Math.min(255, (col[2] * pulse) | 0)})`;
              crispCtx.fillStyle = style;
              crispCtx.fillText(ch, xStart + i * CW + CW * 0.5, yPx);
              bloomSrcCtx.fillStyle = style;
              bloomSrcCtx.fillText(ch, xStart + i * CW + CW * 0.5, yPx);
            }
          }
        }

        const sign = inpSign.value.trim();
        if (sign) {
          crispCtx.font = "13px Consolas, Menlo, monospace";
          crispCtx.textAlign = "left";
          crispCtx.textBaseline = "bottom";
          crispCtx.fillStyle = "rgb(184, 176, 206)";
          crispCtx.fillText(sign, 14, H - 10);
        }

        // Composite crisp layer + Selective Highlight Bloom
        ctx.globalCompositeOperation = "source-over";
        ctx.drawImage(crispCanvas, 0, 0);

        if (glowAmt > 0.01) {
          glowCtx.clearRect(0, 0, glowCanvas.width, glowCanvas.height);
          glowCtx.drawImage(bloomSrcCanvas, 0, 0, glowCanvas.width, glowCanvas.height);
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.filter = "blur(6px)";
          ctx.globalAlpha = glowAmt * 0.95;
          ctx.drawImage(glowCanvas, 0, 0, W, H);
          ctx.restore();
        }
      }

      requestAnimationFrame(render);
    }

    function loadFile(file) {
      if (!file) return;
      if (file.type.startsWith("video/")) {
        if (currentVideoUrl) URL.revokeObjectURL(currentVideoUrl);
        currentVideoUrl = URL.createObjectURL(file);
        mediaType = "video";
        srcVideo.src = currentVideoUrl;
        srcVideo.onloadedmetadata = () => {
          allocateGridBuffers();
          vidSeek.max = srcVideo.duration || 100;
          vidSeek.value = 0;
          vidTime.textContent = `0:00 / ${fmtTime(srcVideo.duration)}`;
          videoBar.classList.add("visible");
          btnExportVideo.classList.add("visible");
          metaHint.textContent = `Video: ${srcVideo.videoWidth}×${srcVideo.videoHeight} · ${fmtTime(srcVideo.duration)}`;
          srcVideo.play().catch(() => {});
          btnPlayPause.textContent = "⏸ Dừng";
        };
      } else if (file.type.startsWith("image/")) {
        if (!srcVideo.paused) srcVideo.pause();
        videoBar.classList.remove("visible");
        btnExportVideo.classList.remove("visible");
        mediaType = "image";
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          sourceImage = img;
          allocateGridBuffers();
          sampleCurrentFrame();
          revealProgress = 0.0;
          metaHint.textContent = `Ảnh: ${img.naturalWidth}×${img.naturalHeight}px`;
          URL.revokeObjectURL(url);
        };
        img.src = url;
      }
    }

    // Export Video with Original Audio
    async function toggleExportVideo() {
      if (isExporting) {
        if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
        return;
      }
      if (mediaType !== "video" || !srcVideo.duration) return;

      isExporting = true;
      btnExportVideo.classList.add("recording");
      btnExportVideo.textContent = "⏹ Đang chuẩn bị...";

      const canvasStream = canvas.captureStream(30);
      const combinedTracks = [...canvasStream.getVideoTracks()];

      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          audioSrcNode = audioCtx.createMediaElementSource(srcVideo);
          audioDestNode = audioCtx.createMediaStreamDestination();
          audioSrcNode.connect(audioDestNode);
          audioSrcNode.connect(audioCtx.destination);
        }
        if (audioCtx.state === "suspended") await audioCtx.resume();
        for (const t of audioDestNode.stream.getAudioTracks()) combinedTracks.push(t);
      } catch (e) {
        // Silent fallback if browser blocks AudioContext routing
      }

      const stream = new MediaStream(combinedTracks);
      const mimeTypes = [
        "video/mp4;codecs=avc1",
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm"
      ];
      const chosenMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || "";
      recordedChunks = [];
      mediaRecorder = chosenMime
        ? new MediaRecorder(stream, { mimeType: chosenMime, videoBitsPerSecond: 8000000 })
        : new MediaRecorder(stream, { videoBitsPerSecond: 8000000 });

      mediaRecorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size > 0) recordedChunks.push(ev.data);
      };

      mediaRecorder.onstop = () => {
        isExporting = false;
        srcVideo.loop = true;
        btnExportVideo.classList.remove("recording");
        btnExportVideo.textContent = "🎬 Xuất Video ASCII (kèm âm thanh)";
        if (recordedChunks.length > 0) {
          const ext = chosenMime.includes("mp4") ? "mp4" : "webm";
          const blob = new Blob(recordedChunks, { type: chosenMime || "video/webm" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `ascii_video_${Date.now()}.${ext}`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
        }
      };

      srcVideo.pause();
      srcVideo.loop = false;
      srcVideo.currentTime = 0;

      const onEnded = () => {
        srcVideo.removeEventListener("ended", onEnded);
        if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
      };
      srcVideo.addEventListener("ended", onEnded);

      mediaRecorder.start(250);
      srcVideo.play().catch(() => {});
      btnPlayPause.textContent = "⏸ Dừng";
    }

    // Event bindings
    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    dropzone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => loadFile(e.target.files[0]);
    dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add("dragover"); };
    dropzone.ondragleave = () => dropzone.classList.remove("dragover");
    dropzone.ondrop = (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");
      loadFile(e.dataTransfer.files[0]);
    };

    slCols.oninput = () => {
      document.getElementById("valCols").textContent = slCols.value;
      allocateGridBuffers();
      sampleCurrentFrame();
    };
    slBlack.oninput = () => { document.getElementById("valBlack").textContent = slBlack.value + "%"; };
    slBright.oninput = () => { document.getElementById("valBright").textContent = parseFloat(slBright.value).toFixed(2); };
    slContrast.oninput = () => { document.getElementById("valContrast").textContent = parseFloat(slContrast.value).toFixed(2); };
    slGlow.oninput = () => { document.getElementById("valGlow").textContent = slGlow.value + "%"; };

    let lastHadFooter = false;
    function syncFooterRows() {
      const hasFooter = inpCaption.value.trim().length > 0 || inpSign.value.trim().length > 0;
      if (hasFooter !== lastHadFooter) {
        lastHadFooter = hasFooter;
        allocateGridBuffers();
        sampleCurrentFrame();
      }
    }
    inpCaption.addEventListener("input", syncFooterRows);
    inpSign.addEventListener("input", syncFooterRows);

    btnPlayPause.onclick = () => {
      if (mediaType !== "video") return;
      if (srcVideo.paused) { srcVideo.play(); btnPlayPause.textContent = "⏸ Dừng"; }
      else { srcVideo.pause(); btnPlayPause.textContent = "▶ Phát"; }
    };
    vidSeek.oninput = () => {
      if (mediaType === "video") {
        srcVideo.currentTime = parseFloat(vidSeek.value);
        vidTime.textContent = `${fmtTime(srcVideo.currentTime)} / ${fmtTime(srcVideo.duration)}`;
      }
    };
    btnMute.onclick = () => {
      srcVideo.muted = !srcVideo.muted;
      btnMute.textContent = srcVideo.muted ? "🔇 Tắt tiếng" : "🔊 Tiếng";
    };
    btnExportVideo.onclick = toggleExportVideo;

    document.getElementById("btnReplay").onclick = () => {
      if (mediaType === "video") { srcVideo.currentTime = 0; srcVideo.play(); btnPlayPause.textContent = "⏸ Dừng"; }
      else { revealProgress = 0.0; }
    };
    document.getElementById("btnDownload").onclick = () => {
      const a = document.createElement("a");
      a.download = `ascii_art_${Date.now()}.png`;
      a.href = canvas.toDataURL("image/png");
      a.click();
    };
    document.getElementById("btnCopyTxt").onclick = async () => {
      const btn = document.getElementById("btnCopyTxt");
      try {
        await navigator.clipboard.writeText(buildRawAsciiText());
        btn.textContent = "✅ Đã Copy ASCII!";
        setTimeout(() => { btn.textContent = "📋 Copy Text ASCII"; }, 1800);
      } catch {
        btn.textContent = "Không copy được";
        setTimeout(() => { btn.textContent = "📋 Copy Text ASCII"; }, 1800);
      }
    };

    sourceImage = createDemoImage();
    allocateGridBuffers();
    sampleCurrentFrame();
    requestAnimationFrame(render);
  </script>
</body>
</html>
